<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Código QR · QR Empresarial</title>
  <meta name="description" content="Genera y personaliza el código QR dinámico de tu negocio en QR Empresarial." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4F46E5" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css" />
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/qr.css" />
  <link rel="stylesheet" href="css/polish.css" />
</head>
<body>
  <div class="app-shell">
    <nav id="sidebar" aria-label="Navegación principal"></nav>
    <div class="app-main">
      <header id="topbar"></header>

      <main class="app-content">
        <div class="qr-grid">

          <!-- Tarjeta principal: vista previa + opciones -->
          <div class="qr-card">
            <div class="qr-card-header">
              <h2>Tu Código QR</h2>
              <span class="pill-online">● En línea</span>
            </div>

            <div class="qr-body">
              <div class="qr-preview-col">
                <div class="qr-canvas-wrap">
                  <canvas id="qr-canvas"></canvas>
                </div>
                <div class="qr-url-chip">
                  <span id="qr-chip-url">qr.fondalacosecha.co/menu</span>
                </div>
              </div>

              <div class="qr-options-col">
                <div>
                  <div class="qr-option-label">Formato de descarga</div>
                  <div class="qr-format-row" id="format-buttons"></div>
                </div>

                <div>
                  <div class="qr-option-label">Color del código</div>
                  <div class="qr-color-row" id="color-buttons"></div>
                </div>

                <div>
                  <div class="qr-size-row">
                    <label class="label" for="size-slider">Tamaño</label>
                    <span class="value" id="size-value">512 × 512 px</span>
                  </div>
                  <input type="range" id="size-slider" class="qr-size-slider" min="256" max="1024" step="16" value="512">
                  <div class="qr-size-ticks">
                    <span>256px</span>
                    <span>1024px</span>
                  </div>
                </div>

                <div class="qr-action-row">
                  <button id="download-btn" class="btn-primary" style="width:auto;flex:1;">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span id="download-label">Descargar PNG</span>
                  </button>
                  <button id="share-btn" class="icon-btn-lg" title="Compartir" aria-label="Compartir código QR">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                  </button>
                  <button id="copy-link-btn" class="icon-btn-lg" title="Copiar enlace" aria-label="Copiar enlace del perfil">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Panel lateral -->
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div class="qr-side-card">
              <h3>Compartir enlace</h3>
              <button id="copy-link-row" class="qr-link-row" onclick="document.getElementById('copy-link-btn').click()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--slate-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                <span id="qr-link-row-url">qr.fondalacosecha.co/menu</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>

              <a id="share-whatsapp" target="_blank" rel="noopener" class="qr-share-btn" style="background:#D1FAE5;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#047c57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
                <span style="color:#047c57;">WhatsApp</span>
              </a>
              <a id="share-email" class="qr-share-btn" style="background:var(--color-primary-light);">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                <span style="color:var(--color-primary);">Correo electrónico</span>
              </a>
              <a href="https://instagram.com/fondalacosecha.co" target="_blank" rel="noopener" class="qr-share-btn" style="background:#FCE7F3;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ba3878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
                <span style="color:#ba3878;">Instagram</span>
              </a>
            </div>

            <div class="qr-info-box">
              <div class="qr-info-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                QR Dinámico
              </div>
              <p>Cambia el contenido del perfil sin regenerar el QR. Todos los escaneos anteriores siguen funcionando.</p>
            </div>
          </div>

        </div>
      </main>

      <nav id="mobile-nav" aria-label="Navegación móvil"></nav>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/vendor/qrcode.min.js"></script>
  <script src="js/business-data.js"></script>
  <script src="js/layout.js"></script>
  <script>
    initLayout({ title: "Código QR Dinámico", subtitle: "Menú Principal · Se actualiza sin regenerar el código" });
  </script>
  <script src="js/qr.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    }
  </script>
</body>
</html>
