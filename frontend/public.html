<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Lo que hay entre las marcas METADATOS lo reemplaza el servidor en
       /p/:slug con los datos del negocio (backend/src/modules/publico/
       publico.metadatos.js).

       Hace falta en el servidor y no en JavaScript: los robots que generan
       la vista previa -WhatsApp, Telegram, Google- no ejecutan JS, así que
       leen lo que venga en el HTML. Mientras esto estuvo escrito a mano,
       cualquier negocio que compartiera su enlace mostraba la vista previa
       del negocio de ejemplo, y el bloque de Schema.org declaraba una
       calificación de 4,6 estrellas con 215 reseñas que nadie había dejado.

       Lo de aquí abajo es el valor por defecto: se ve al abrir
       public.html?slug=... directamente, sin pasar por /p/:slug. -->
  <!-- METADATOS:INICIO -->
  <title>Perfil · QR Empresarial</title>
  <meta name="description" content="Perfil empresarial publicado con QR Empresarial." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Perfil · QR Empresarial" />
  <meta property="og:description" content="Perfil empresarial publicado con QR Empresarial." />
  <meta property="og:image" content="/assets/og-image.png" />
  <meta property="og:locale" content="es_CO" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Perfil · QR Empresarial" />
  <meta name="twitter:image" content="/assets/og-image.png" />
  <!-- METADATOS:FIN -->
  <!-- Rutas absolutas a proposito: esta pantalla tambien se sirve en
       /p/<slug>, y desde ahi una ruta relativa apuntaria a /p/js/... -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#4F46E5" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/public.css" />
  <link rel="stylesheet" href="/css/polish.css" />
</head>
<body class="public-page">

  <main class="profile-wrap">
    <div class="profile-card" id="public-card">

      <!-- Banner + logo -->
      <div class="profile-banner-wrap">
        <div class="profile-banner"></div>
        <div class="profile-avatar">
          <svg class="profile-avatar-logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo del negocio">
            <circle cx="24" cy="10" r="4" fill="currentColor" opacity="0.85"/>
            <path d="M24 16 L24 40" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M24 20 C19 19, 15 21, 13 25" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
            <path d="M24 27 C19 26, 15 28, 13 32" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
            <path d="M24 34 C19 33, 15 35, 13 39" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
            <path d="M24 20 C29 19, 33 21, 35 25" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
            <path d="M24 27 C29 26, 33 28, 35 32" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
            <path d="M24 34 C29 33, 33 35, 35 39" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
            <path d="M10 41 C10 43.2, 16.3 45, 24 45 C31.7 45, 38 43.2, 38 41" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
      </div>

      <!-- Info del negocio -->
      <!-- Los campos de aquí abajo van vacíos a propósito: los rellena
           public.js con el negocio que corresponda. Antes traían los datos
           del negocio de ejemplo, y lo que no ejecuta JavaScript -los
           buscadores, los robots de vista previa- leía la dirección y el
           teléfono de un restaurante de Medellín para cualquier negocio. -->
      <div class="profile-info">
        <div class="profile-name-row">
          <h1 id="profile-name"></h1>
          <svg class="verified-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>

        <p class="profile-description" id="profile-description"></p>

        <div class="profile-meta">
          <div class="profile-meta-row">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            <span id="profile-address"></span>
          </div>
          <div class="profile-meta-row is-open">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="profile-hours"></span>
          </div>
          <div class="profile-meta-row">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--slate-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <span id="profile-phone"></span>
          </div>
        </div>
      </div>

      <!-- Enlaces de acción -->
      <div class="profile-links">
        <a id="link-menu" href="/menu.html" class="profile-link-btn link-primary-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>Ver menú completo</span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </a>

        <a id="link-reserve" href="tel:+573004567890" class="profile-link-btn link-primary-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <span>Reservar mesa</span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </a>

        <a id="link-maps" target="_blank" rel="noopener" class="profile-link-btn link-outline-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--slate-700)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span>Cómo llegar · Google Maps</span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--slate-700)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </a>

        <a id="link-whatsapp" target="_blank" rel="noopener" class="profile-link-btn link-whatsapp-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
          <span id="link-whatsapp-text"></span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </a>

        <a id="link-instagram" target="_blank" rel="noopener" class="profile-link-btn link-instagram-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
          <span id="link-instagram-text"></span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </a>

        <a id="link-email" class="profile-link-btn link-outline-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--slate-700)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <span id="link-email-text"></span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--slate-700)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
      </div>

      <!-- Contenido que arma la empresa desde el panel (RF-05 y RF-06).
           Lo rellena public.js con lo que devuelva la API; si no hay nada,
           queda vacío y no se ve. -->
      <div class="profile-sections" id="public-content"></div>
    </div>

    <!-- Si el perfil no existe, la cuenta está restringida o el código fue
         desactivado, se muestra esto en lugar de la tarjeta -->
    <div class="profile-card profile-unavailable" id="public-unavailable" hidden>
      <h1>Este perfil no está disponible</h1>
      <p>
        Puede que la dirección esté mal escrita o que el negocio haya dejado de
        publicar su perfil. Si llegó escaneando un código, pregúntele al negocio
        por uno actualizado.
      </p>
    </div>

    <div class="profile-footer">
      <span>Powered by <strong>QR Empresarial</strong></span>
    </div>
  </main>

  <script src="/js/business-data.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/public.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/service-worker.js").catch(() => {});
    }
  </script>
</body>
</html>
