<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menú · QR Empresarial</title>
  <meta name="description" content="Consulta el menú digital del negocio, con la información que publica desde su panel." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4F46E5" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css" />
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/menu.css" />
  <link rel="stylesheet" href="css/polish.css" />
</head>
<body class="menu-page">

  <main class="menu-wrap">
    <div class="menu-header">
      <a href="/public.html" class="menu-back" id="menu-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        Volver al perfil
      </a>
      <h1 id="menu-biz-name">Menú</h1>
      <p id="menu-subtitle">Cargando...</p>
    </div>

    <!-- Lo llena menu.js con la sección "menu" del perfil (RF-05) -->
    <div id="menu-items"></div>

    <div class="menu-empty" id="menu-empty" hidden>
      <p>Este negocio todavía no ha publicado su menú.</p>
    </div>

    <div class="menu-footer">
      <span>Powered by <strong>QR Empresarial</strong></span>
    </div>
  </main>

  <script src="js/business-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/menu.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    }
  </script>
</body>
</html>
